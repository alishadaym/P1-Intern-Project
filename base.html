<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mall App{% endblock %}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 32px 28px;
      width: 320px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 20px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .place {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .floor {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 24px;
    }
    a.button {
      display: inline-block;
      background: #2dd4bf;
      color: #06231f;
      font-weight: 600;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
    }
    p.muted {
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
