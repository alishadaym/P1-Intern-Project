<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Owner Dashboard - DPULZE</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #564228;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .dashboard {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: #e6d4bc;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
            font-size: 17px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
        }

        .shop-details {
            margin-top: 25px;
        }

        .detail {
            margin: 16px 0;
        }

        button {
            width: 100%;
            padding: 14px 18px;
            margin-top: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .edit-button {
            margin-top: 20px;
        }

    </style>
</head>

<body>

<div class="dashboard">

    <h1>Store Owner Dashboard</h1>

    <p>
        Welcome, <strong>{{ owner.username }}</strong>!
    </p>

    <div class="shop-details">

        <h2>Your Store</h2>

        <div class="detail">
            <strong>Name:</strong>
            {{ owner.shop_name }}
        </div>

        <div class="detail">
            <strong>Category:</strong>
            {{ owner.category }}
        </div>

        <div class="detail">
            <strong>Operating Hours:</strong>
            {{ owner.operating_hours }}
        </div>

        <div class="detail">
            <strong>Description:</strong>
            {{ owner.description }}
        </div>

    </div>

    <button
        class="edit-button"
        onclick="window.location.href='/store-owner/edit'">
        Edit Store Details
    </button>

    <button onclick="logout()">
        Logout
    </button>

</div>


<script>

// async: the function can perform
// asynchronous operations without blocking page
async function logout() {

    const response = await fetch("/api/logout", {
        method: "POST"
    });

    if (response.ok) {
        window.location.href = "/login";
    }

}

</script>

</body>

</html>
