<!DOCTYPE html>
<html>

<head>
    <title>Store Owner Dashboard - DPULZE</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #564228;
            margin: 0;
            padding: 40px;
        }

        .dashboard {
            max-width: 600px;
            margin: auto;
            background: #e6d4bc;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .shop-details {
            margin-top: 25px;
        }

        .detail {
            margin: 12px 0;
        }

        button {
            padding: 10px 18px;
            margin-top: 20px;
            cursor: pointer;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
        }

        #editStoreButton {
            background: #70461e;
            color: white;
        }

        #logoutButton {
            background: #dc3545;
            color: white;
        }

        .edit-button {
            margin-right: 10px;
        }

    </style>
</head>

<body>

<div class="dashboard">

    <h1>Store Owner Dashboard</h1>

    <p>
        Welcome, <strong>{{ owner.username }}</strong>!
    </p>

    <div class="shop-details">

        <h2>Your Store</h2>

        <div class="detail">
            <strong>Name:</strong>
            {{ owner.shop_name }}
        </div>

        <div class="detail">
            <strong>Category:</strong>
            {{ owner.category }}
        </div>

        <div class="detail">
            <strong>Operating Hours:</strong>
            {{ owner.operating_hours }}
        </div>

        <div class="detail">
            <strong>Description:</strong>
            {{ owner.description }}
        </div>

    </div>

    <button
        id="editStoreButton"
        class="edit-button"
        onclick="window.location.href='/store-owner/edit'">
        Edit Store Details
    </button>

    <button id="logoutButton"onclick="logout()">
        Logout
    </button>

</div>


<script>

// async: the function can perform
// asynchronous operations without blocking page
async function logout() {

    const response = await fetch("/api/logout", {
        method: "POST"
    });

    if (response.ok) {
        window.location.href = "/login";
    }

}

</script>

</body>

</html>
