<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password - DPULZE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
            margin: 0;
        }

        .forgot-box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        p {
            line-height: 1.5;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin-top: 20px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #submitButton {
            background: #007bff;
            color: white;
        }

        #backButton {
            background: #6c757d;
            color: white;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="forgot-box">

    <h1>Forgot Password?</h1>

    <p>
        Enter your store owner username below.
        If the account exists, please contact the system administrator
        to reset your password.
    </p>

    <form id="forgotPasswordForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            required
        >

        <button
            type="submit"
            id="submitButton">
            Submit
        </button>

        <button
            type="button"
            id="backButton"
            onclick="window.location.href='/login'">
            Back to Login
        </button>

    </form>

    <p id="message"></p>

</div>


<script>

document.getElementById("forgotPasswordForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const message =
            document.getElementById("message");

        try {

            const response = await fetch(
                "/api/forgot-password",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username
                    })
                }
            );

            const result = await response.json();

            message.textContent = result.message;

        } catch (error) {

            console.error(error);

            message.textContent =
                "An error occurred. Please try again.";

        }

    });

</script>

</body>

</html>
