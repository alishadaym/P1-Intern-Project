<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - DPULZE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #564228;
            padding: 40px;
            margin: 0;
            box-sizing: border-box;
        }

        .feedback-box {
            max-width: 550px;
            margin: auto;
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 12px;
            border: 1px solid #d9d9d9;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 1.6rem;
        }

        .subtitle {
            text-align: center;
            color: #444;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        hr {
            border: none;
            border-top: 1px solid #d9d9d9;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .field {
            flex: 1;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #444;
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #eaf3fc;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .consent-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-top: 20px;
        }

        .consent-row input[type="checkbox"] {
            width: auto;
            margin-top: 3px;
        }

        .consent-row label {
            margin-top: 0;
            font-size: 14px;
            color: #444;
            font-weight: normal;
        }

        .submit-row {
            text-align: center;
        }

        #submitButton {
            padding: 10px 30px;
            margin-top: 22px;
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: #000000;
            color: white;
            font-size: 15px;
        }

        #backButton {
            display: block;
            margin: 12px auto 0;
            padding: 8px 18px;
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: #6c757d;
            color: white;
            font-size: 13px;
        }

        #adminLoginButton {
            display: block;
            margin: 10px auto 0;
            padding: 8px 18px;
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: #7b5b3d;
            color: white;
            font-size: 13px;
        }

        #message-status {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 500px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<div class="feedback-box">

    <h1>We are happy to help!</h1>

    <p class="subtitle">
        Please fill out the following form with your feedback
    </p>

    <hr>

    <form id="feedbackForm">

        <label for="name">Your Name</label>
        <input type="text" id="name">

        <div class="form-row">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input type="text" id="phone">
            </div>
        </div>

        <label for="incident_date">Date</label>
        <input type="date" id="incident_date">

        <label for="message">Feedback</label>
        <textarea id="message" required></textarea>

        <label for="resolution">How would you like this to be resolved?</label>
        <textarea id="resolution"></textarea>

        <div class="consent-row">
            <input type="checkbox" id="consent" required>
            <label for="consent">
                All the data I submitted is truthful.
            </label>
        </div>

        <div class="submit-row">
            <button type="submit" id="submitButton">Submit</button>
        </div>

        <button
            type="button"
            id="backButton"
            onclick="window.location.href='/'">
            Back to Guest Page
        </button>

        <button
            type="button"
            id="adminLoginButton"
            onclick="window.location.href='/admin/login'">
            Admin Login
        </button>

    </form>

    <p id="message-status"></p>

</div>


<script>

document.getElementById("feedbackForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const incidentDate = document.getElementById("incident_date").value;
        const message = document.getElementById("message").value.trim();
        const resolution = document.getElementById("resolution").value.trim();

        const status = document.getElementById("message-status");

        if (!message) {
            status.textContent = "Please describe your feedback before submitting.";
            return;
        }

        try {

            const response = await fetch(
                "/api/feedback",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        phone: phone,
                        incident_date: incidentDate,
                        message: message,
                        resolution: resolution
                    })
                }
            );

            const result = await response.json();

            if (response.ok) {

                status.textContent = "Thank you! Your feedback has been submitted.";
                document.getElementById("feedbackForm").reset();

            } else {

                status.textContent = result.error || "Failed to submit feedback. Please try again.";

            }

        } catch (error) {

            console.error(error);

            status.textContent = "Unable to connect to the server. Please try again.";

        }

    });

</script>

</body>

</html>
