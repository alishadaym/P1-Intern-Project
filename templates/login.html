<!DOCTYPE html>
<html>
<head>
    <title>Store Owner Login - DPULZE</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #564228;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: #e6d4bc;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px 18px;
            margin-top: 20px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #loginButton {
            background: #70461e;
            color: white;
        }

        #guestBackButton {
            background: #464f57;
            color: white;
        }

        #forgotPasswordButton {
            background: #e72828;
            color: white;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Store Owner Login</h1>

    <form id="loginForm">

        <label>Username</label>
        <input type="text" id="username" required>

        <label>Password</label>
        <input type="password" id="password" required>

        <button 
            type="submit" 
            id="loginButton">
            Login
        </button>

        <button
            type="button"
            id="forgotPasswordButton"
            onclick="window.location.href='/forgot-password'">
            Forgot Password?
        </button>

        <button
            type="button"
            id="guestBackButton"
            onclick="window.location.href='/guest'">
            Back to Guest Page
        </button>

    </form>

    <p id="message"></p>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    message.textContent = "";


    try {

        const response = await fetch(
            "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


        const result = await response.json();


        if (response.ok) {

            window.location.href = "/store-owner";

        } else {

            message.textContent =
                result.error || "Login failed. Please try again.";

            setTimeout(function() {
                message.textContent = "";
            }, 3000);

        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to the server. Please try again.";

        setTimeout(function() {
            message.textContent = "";
        }, 3000);

    }

});

</script>

</body>
</html>
