<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Assistant</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f6f3ef;
            color: #2a1f1a;
        }

        body {
            display: flex;
            align-items: stretch;
            min-height: 100vh;
        }

        .chat-shell {
            width: min(100%, 980px);
            height: 100vh;
            margin: 0 auto;
            background: #fff;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 24px;
            background: #5a3f33;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .new-chat-btn {
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .new-chat-btn:hover {
            background: rgba(255,255,255,0.16);
        }

        .chat-body {
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
            padding: 20px;
            background: #faf7f2;
        }

        .message {
            max-width: 75%;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            text-align: left;
        }

        .assistant {
            margin-right: auto;
            background: #fff;
            border: 1px solid #e8dfd5;
            text-align: left;
        }

        .user {
            margin-left: auto;
            background: #f0d9c4;
            color: #2c221d;
        }

        .chat-form {
            flex: 0 0 auto;
            display: flex;
            gap: 12px;
            padding: 16px 20px 20px;
            border-top: 1px solid #eee1d6;
            background: white;
        }

        .chat-form input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d9c7b3;
            border-radius: 10px;
            font-size: 1rem;
        }

        .chat-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #6f4b3e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-form button:hover {
            background: #593d31;
        }

        .navigation-link {
            display: inline-block;
            margin-top: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            background: #6f4b3e;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        .navigation-link:hover {
            background: #593d31;
        }

        .chat-header-left {
        display: flex;
        align-items: center;
        gap: 16px;
        }

        .chat-header-left .menu-toggle {
            position: static;

            background: transparent;
            border: none;

            color: #FCF2E5;

            font-size: 28px;
            line-height: 1;

            cursor: pointer;

            padding: 2px 4px;

            z-index: 1100;
        }

        .chat-header-left .menu-toggle:hover {
            opacity: 0.8;
        }

        .website-link {
            display: inline-block;
            margin-top: 12px;
            margin-right: 8px;

            padding: 9px 14px;

            border-radius: 8px;

            background: #EC5B38;
            color: white;

            font-weight: bold;
            text-decoration: none;
        }

        .website-link:hover {
            background: #F0997D;
        }
    </style>
</head>

<link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">

<body>
    <div class="chat-shell">
        <div class="chat-header">
            <div class="chat-header-left">
                {% include "includes/menu.html" %}
            
                <span>Mall Assistant</span>
            </div>
            <button type="button" class="new-chat-btn" id="new-chat-btn">New Chat</button>
        </div>
        
        <div class="chat-body" id="chat-body">
            <div class="message assistant">Hi! I can help with mall navigation, store recommendations, category suggestions, and shopping preferences.</div>
        </div>

        <form class="chat-form" id="chat-form">
            <input id="chat-input" type="text" placeholder="Ask about stores, mall info, or shopping ideas..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatBody = document.getElementById("chat-body");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");
        const newChatButton = document.getElementById("new-chat-btn");

        function addMessage(role, text) {
            const message = document.createElement("div");
            message.className = `message ${role}`;
            message.textContent = text;
            chatBody.appendChild(message);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function addNavigationLink(url) {
            const link = document.createElement("a");
            link.className = "navigation-link";
            link.href = url;
            link.textContent = url.includes("nearest=1")
                ? "Find Nearest Restroom"
                : "Show Navigation on Map";
            chatBody.lastElementChild.appendChild(link);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function addWebsiteLink(url, shopName) 
            {
                if (!url) {
                    return;
                }

                const link = document.createElement("a");

                link.className = "website-link";

                link.href = url;

                link.target = "_blank";

                link.rel = "noopener noreferrer";

                link.textContent = shopName ? `Visit ${shopName} Official Website` : "Visit Official Website";

                const lastMessage = chatBody.lastElementChild;

                if (lastMessage) {
                    lastMessage.appendChild(link);
                }

                chatBody.scrollTop = chatBody.scrollHeight;
            }

        function clearSessionMemory() {
            fetch("/api/chat/reset", { method: "POST" });
        }

        function resetChat() {
                chatBody.innerHTML =
                    '<div class="message assistant">Hi! I can help with mall navigation, store recommendations, category suggestions, and shopping preferences.</div>';

                chatInput.value = "";
                clearSessionMemory();
                chatInput.focus();
            }

        window.addEventListener("pagehide", clearSessionMemory);
        window.addEventListener("beforeunload", clearSessionMemory);
        newChatButton.addEventListener("click", resetChat);

        chatForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            const message = chatInput.value.trim();

            if (!message) {
                return;
            }

            addMessage("user", message);
            chatInput.value = "";

            let assistantReply = "I’m thinking...";
            addMessage("assistant", assistantReply);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                const lastMessage = chatBody.lastElementChild;
                if (lastMessage) {
                    lastMessage.textContent = data.reply || "I’m not sure, but I can help with mall information and recommendations.";
                }
                if (data.navigation_url) {
                    addNavigationLink(data.navigation_url);
                }
                if (data.website_url) {
                    addWebsiteLink(
                        data.website_url,
                        data.website_name
                    );
                }
            } catch (error) {
                const lastMessage = chatBody.lastElementChild;
                if (lastMessage) {
                    lastMessage.textContent = "The assistant is temporarily unavailable. Please try again in a moment.";
                }
            }
        });
    </script>

    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    
</body>
</html>
