<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mall Assistant</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f6f3ef;
            color: #2a1f1a;
        }

        body {
            display: flex;
            align-items: stretch;
            min-height: 100vh;
        }

        .chat-shell {
            width: min(100%, 980px);
            height: 100vh;
            margin: 0 auto;
            background: #fff;
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            flex: 0 0 auto;
            padding: 18px 24px;
            background: #5a3f33;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .chat-body {
            flex: 1 1 auto;
            min-height: 0;
            max-height: none;
            overflow-y: auto;
            padding: 20px;
            background: #faf7f2;
        }

        .message {
            max-width: 75%;
            padding: 12px 14px;
            border-radius: 14px;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .user {
            margin-left: auto;
            background: #f0d9c4;
            color: #2c221d;
        }

        .assistant {
            margin-right: auto;
            background: #fff;
            border: 1px solid #e8dfd5;
        }

        .chat-form {
            flex: 0 0 auto;
            display: flex;
            gap: 12px;
            padding: 16px 20px 20px;
            border-top: 1px solid #eee1d6;
            background: white;
        }

        .chat-form input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d9c7b3;
            border-radius: 10px;
            font-size: 1rem;
        }

        .chat-form button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: #6f4b3e;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-form button:hover {
            background: #593d31;
        }
    </style>
</head>
<body>
    <div class="chat-shell">
        <div class="chat-header">Mall Assistant</div>

        <div class="chat-body" id="chat-body">
            <div class="message assistant">
                Hi! I can help with mall navigation, store recommendations, category suggestions, and shopping preferences.
            </div>
        </div>

        <form class="chat-form" id="chat-form">
            <input id="chat-input" type="text" placeholder="Ask about stores, mall info, or shopping ideas..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const chatBody = document.getElementById("chat-body");
        const chatForm = document.getElementById("chat-form");
        const chatInput = document.getElementById("chat-input");

        function addMessage(role, text) {
            const message = document.createElement("div");
            message.className = `message ${role}`;
            message.textContent = text;
            chatBody.appendChild(message);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function clearSessionMemory() {
            fetch("/api/chat/reset", { method: "POST" });
        }

        window.addEventListener("pagehide", clearSessionMemory);
        window.addEventListener("beforeunload", clearSessionMemory);

        chatForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            const message = chatInput.value.trim();

            if (!message) {
                return;
            }

            addMessage("user", message);
            chatInput.value = "";

            let assistantReply = "I’m thinking...";
            addMessage("assistant", assistantReply);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                const lastMessage = chatBody.lastElementChild;
                if (lastMessage) {
                    lastMessage.textContent = data.reply || "I’m not sure, but I can help with mall information and recommendations.";
                }
            } catch (error) {
                const lastMessage = chatBody.lastElementChild;
                if (lastMessage) {
                    lastMessage.textContent = "The assistant is temporarily unavailable. Please try again in a moment.";
                }
            }
        });
    </script>
</body>
</html>
