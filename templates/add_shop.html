<!DOCTYPE html>
<html>
<head>
    <title>Add Shop - DPULZE</title>
</head>

<body>

    <h1>Add Shop</h1>

    <form id="shopForm">

        <label>Shop Name:</label>
        <input type="text" id="shop_name" required>
        <br><br>

        <label>Category:</label>
        <input type="text" id="category">
        <br><br>

        <label>Unit:</label>
        <input type="text" id="unit" placeholder="e.g. G-14">
        <br><br>

        <label>Operating Hours:</label>
        <input type="text" id="operating_hours" placeholder="e.g. 10am – 10pm">
        <br><br>

        <label>Description:</label>
        <textarea id="description"></textarea>
        <br><br>

        <label>Floor:</label>
        <select id="floor_id" required>
            <option value="1">Ground Floor</option>
        </select>
        <br><br>

        <button type="submit">Add Shop</button>

    </form>

    <p id="message"></p>


    <script>

        document.getElementById("shopForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const shopData = {
                shop_name: document.getElementById("shop_name").value,
                category: document.getElementById("category").value,
                unit: document.getElementById("unit").value,
                operating_hours: document.getElementById("operating_hours").value,
                description: document.getElementById("description").value,
                floor_id: Number(document.getElementById("floor_id").value)
            };

            const response = await fetch("/api/shops", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(shopData)
            });

            const result = await response.json();

            const message = document.getElementById("message");

            if (response.ok) {
                message.textContent = "Shop added successfully!";
                document.getElementById("shopForm").reset();
            } else {
                message.textContent = result.error;
            }

        });

    </script>

</body>
</html>
