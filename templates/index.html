<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dpulze Mall Navigation</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css' )}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css' )}}">
</head>

<body>
    <header class="site-header">
        {% include 'includes/menu.html' %}
        <h1>Dpulze Mall Navigation</h1>
                <!-- <a href="/login" class="login-button">Store Owner Login</a> -->
        <!-- {% if current %} -->
            <p class="scanned-location">You scanned: {{ current.label }}</p>
        <!-- {% endif %} -->
    </header>

    <main>
        <aside class="sidebar">
            <h2>Navigation</h2>

            <label for="shop-search">Find Shop</label>
            <div class="shop-autocomplete">
                <input type="text" id="shop-search" placeholder="Search shops..." autocomplete="off">
                <ul id="shop-suggestions" class="shop-suggestions"></ul>
            </div>
            <select id="shop-select" class="hidden-select">
                <option value="">Select a shop</option>
            </select>

            <label for="category-select">Category</label>
            <select id="category-select">
                <option value="">Select a category</option>
            </select>

            <button id="navigate-btn" class="navigate-btn">Navigate</button>

            <div class="category-shops-section">
                <h3 id="category-results-title">Category Results</h3>
                <div id="category-shop-list">Select a category to see shops or utilities</div>
            </div>

        </aside>

        <section class="map-section">
            <div class="map-viewport" id="map-viewport">
                <div class="floor-switcher">
                    <label for="floor-select">Floor</label>
                    <select id="floor-select">
                        <option value="ground">Ground Floor</option>
                        <option value="upper-ground">Upper Ground Floor</option>
                        <option value="2f">2nd Floor</option>
                    </select>
                </div>
                <div class="map-container">
                    <img src="{{ url_for('static', filename='img/dpulze_ground_floor.png') }}"
                        id="floor-map" alt="Dpulze Ground Floor Map">

                    <svg id="map-overlay" viewBox="0 0 1038 553" preserveAspectRatio="xMidYMid meet">
                        <g id="navigation-lines"></g>
                        <g id="navigation-nodes"></g>
                    
                        <!-- Clickable shop areas -->
                        <g id="shop-hotspots"></g>
                    
                        <!-- POI markers -->
                        <g id="poi-markers"></g>
                    
                        <!-- Route -->
                        <polyline id="route-line" points=""></polyline>
                    
                        <!-- User -->
                        <image id="user-marker" href="{{ url_for('static', filename='img/user-pin.png') }}" width="24" height="36"></image>
                    </svg>
                </div>
                <div class="map-controls" aria-label="Map zoom controls">
                    <button id="zoom-in-btn" type="button" aria-label="Zoom in">+</button>
                    <button id="zoom-out-btn" type="button" aria-label="Zoom out">-</button>
                    <button id="zoom-reset-btn" type="button" aria-label="Reset map view">Reset</button>
                </div>
            </div>
        </section>
    </main>

    <div class="shop-modal utility-modal" id="shop-modal" hidden>
        <div class="shop-modal-content utility-modal-content shop-popover-content" role="dialog" aria-modal="true" aria-labelledby="modal-shop-name">
            <button class="shop-modal-close" id="close-shop-modal" type="button" aria-label="Close store details">&times;</button>
            <h2 id="modal-shop-name"></h2>
            <div class="shop-modal-details" id="modal-shop-details">
                <p id="modal-shop-category"></p>
                <p id="modal-shop-unit"></p>
                <p id="modal-shop-floor"></p>
                <p id="modal-shop-hours"></p>
                <p id="modal-shop-description"></p>

                <button type="button" id="more-details-btn" class="more-details-btn">
                    More Details
                </button>
            </div>
        </div>
    </div>

    <div class="shop-modal utility-modal" id="utility-modal" hidden>
        <div class="shop-modal-content utility-modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-utility-name">
            <button class="shop-modal-close" id="close-utility-modal" type="button" aria-label="Close utility details">&times;</button>
            <h2 id="modal-utility-name"></h2>
            <div class="shop-modal-details">
                <p id="modal-utility-floor"></p>
                <p id="modal-utility-status"></p>
            </div>
        </div>
    </div>

    <div id="full-shop-modal" class="full-shop-modal">
    
        <div class="full-shop-modal-content">

            <button type="button" id="full-modal-close" class="full-modal-close">×</button>
    
            <h2 id="full-modal-shop-name"></h2>
    
            <div class="full-modal-basic-info">
                <div id="full-modal-category"></div>
                <div id="full-modal-unit"></div>
                <div id="full-modal-floor"></div>
                <div id="full-modal-hours"></div>
            </div>
    
            <div class="full-modal-section">
                <h3>About</h3>
                <p id="full-modal-description"></p>
            </div>
    
            <div class="full-modal-section">
                <h3>Products & Services</h3>
                <p id="full-modal-products"></p>
            </div>
    
            <div class="full-modal-section" id="full-modal-website-section">
    
                <h3>Official Website</h3>
    
                <a id="full-modal-website" href="#" target="_blank" rel="noopener noreferrer">Visit Official Website</a>
            </div>
    
            <button type="button" id="full-modal-go-here" class="full-modal-go-here">Go Here</button>
    
        </div>
    
    </div>

    <script>
        // Set by scanning a location QR code (see app.py's index route);
        // falls back to the main entrance when nothing has been scanned yet.
    </script>
    <script id="start-node-data" type="application/json">{{ (start_node or "node_01") | tojson }}</script>
    <script src="{{ url_for('static', filename='js/map.js' )}}"></script>
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
</body>
</html>
