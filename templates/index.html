{% extends "base.html" %}
{% block title %}Mall App{% endblock %}
{% block content %}
  <h1>Mall Wayfinding</h1>
  {% if current %}
    <div class="place">📍 {{ current.floor }}</div>
    <div class="floor">{{ current.label }}</div>
  {% else %}
    <p class="muted">Scan a location QR code to get started.</p>
  {% endif %}
{% endblock %}
