<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mall App{% endblock %}</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 50px;
      box-sizing: border-box;
    }
    .card {
      background: #1c1c1c;
      border-radius: 16px;
      padding: 32px 28px;
      width: 320px;
      max-width: 90vw;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .card:has(.map-wrap) {
      width: 640px;
    }
    .map-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 24px;
      border-radius: 8px;
      overflow: hidden;
      line-height: 0;
    }
    .map-img {
      width: 100%;
      display: block;
      background: #f4f4f4;
    }
    .map-pin {
      position: absolute;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -16px;
      border-radius: 50% 50% 50% 0;
      background: #ff375f;
      border: 2px solid #fff;
      transform: rotate(-45deg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }
    .shop-hotspot {
      position: absolute;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .shop-hotspot:hover {
      background: rgba(45, 212, 191, 0.35);
      outline: 1px solid #2dd4bf;
    }
    .shop-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .shop-modal-backdrop.visible {
      display: flex;
    }
    .shop-modal-card {
      position: relative;
      background: #1c1c1c;
      border-radius: 16px;
      padding: 40px 48px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .shop-modal-name {
      font-size: 22px;
      font-weight: 600;
    }
    .shop-modal-close {
      position: absolute;
      top: 8px;
      right: 12px;
      background: none;
      border: none;
      color: #999;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .shop-modal-close:hover {
      color: #eee;
    }
    table.scans {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.scans th, table.scans td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid #333;
    }
    table.scans th {
      color: #999;
      font-weight: 500;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 20px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }
    .place {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .floor {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 24px;
    }
    a.button {
      display: inline-block;
      background: #2dd4bf;
      color: #06231f;
      font-weight: 600;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
    }
    p.muted {
      color: #999;
    }
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 20px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #1c1c1c;
      border-top: 1px solid #333;
      text-align: center;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="card">
    {% block content %}{% endblock %}
  </div>
  {% block bottom_bar %}{% endblock %}
</body>
</html>
