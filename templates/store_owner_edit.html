<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Store - DPULZE</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #564228;
            padding: 40px;
        }

        .edit-box {
            max-width: 500px;
            margin: auto;
            background: #e6d4bc;
            padding: 30px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input,
        textarea,
        select {
            font-family: Arial, sans-serif;
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            padding: 10px 18px;
            margin-top: 20px;
            margin-right: 10px;
            cursor: pointer;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #saveChangesButton {
            background: #70461e;
            color: white;
        }

        #cancelButton {
            background: #464f57;
            color: white;
        }

        #message {
            margin-top: 15px;
        }

    </style>
</head>

<body>

<div class="edit-box">

    <h1>Edit Store Details</h1>

    <form id="editForm">

        <label>Shop Name</label>
        <input
            type="text"
            id="shop_name"
            value="{{ shop.shop_name }}"
            required
        >

        <label>Category</label>
        <input
            type="text"
            id="category"
            value="{{ shop.category }}"
        >

        <label>Unit</label>
        <input
            type="text"
            id="unit"
            value="{{ shop.unit }}"
            placeholder="e.g. G-14"
        >

        <label>Operating Hours</label>
        <input
            type="text"
            id="operating_hours"
            value="{{ shop.operating_hours }}"
            placeholder="e.g. 10am – 10pm"
        >

        <label>Description</label>
        <textarea id="description">{{ shop.description }}</textarea>

        <label>Floor</label>
        <select id="floor_id" required>

            {% for floor in floors %}

            <option
                value="{{ floor.id }}"
                {% if floor.id == shop.floor_id %}selected{% endif %}
            >
                {{ floor.floor_name }}
            </option>

            {% endfor %}

        </select>

        <button 
            id="saveChangesButton"
            type="submit">
            Save Changes
        </button>

        <button
            id="cancelButton"
            type="button"
            onclick="window.location.href='/store-owner'">
            Cancel
        </button>

    </form>

    <p id="message"></p>

</div>


<script>

document.getElementById("editForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const shopId = "{{shop.id}}";

    const shopData = {

        shop_name: document.getElementById("shop_name").value,

        category: document.getElementById("category").value,

        unit: document.getElementById("unit").value,

        operating_hours: document.getElementById("operating_hours").value,

        description: document.getElementById("description").value,

        floor_id: Number(
            document.getElementById("floor_id").value
        )

    };


    const response = await fetch(
        `/api/shops/${shopId}`,
        {
            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(shopData)
        }
    );


    const result = await response.json();

    const message = document.getElementById("message");


    if (response.ok) {

        message.textContent = "Store details updated successfully!";

        setTimeout(function() {
            message.textContent = "";
        }, 1500); // Clear message after 1.5 seconds

    } else {

        message.textContent = result.error || "Failed to update store.";

    }

});

</script>

</body>

</html>
